name: lastreel
description: "LastReel — an end-credits roll editor for phones."
publish_to: "none"
# Android (Play Store):
# version: 0.0.7+12
# iOS (App Store, first build):
version: 0.0.1+5

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  cookoo_video_export:
    path: ../../shared_packages/cookoo_video_export
  archive: ^4.3.0
  clarity_flutter: ^1.10.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_analytics: ^12.6.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_slidable: ^4.0.3
  gal: ^2.3.3
  google_fonts: ^8.2.1
  google_mobile_ads: ^9.1.0
  google_sign_in: ^7.2.0
  in_app_review: ^2.0.12
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  purchases_flutter: ^10.13.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#F4EEE5"
    theme_color: "#3068DD"

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/cookoo/
    - assets/images/apps/
