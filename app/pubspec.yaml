name: lastreel
description: "LastReel — an end-credits roll editor for phones."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  archive: ^4.3.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_slidable: ^4.0.3
  gal: ^2.3.3
  google_fonts: ^8.2.1
  google_mobile_ads: ^9.1.0
  google_sign_in: ^7.2.0
  in_app_review: ^2.0.12
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true

flutter:
  uses-material-design: true

